<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Administrativo | Ruy Costa</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="shortcut icon" href="assets/img/favicon-32x32.png" type="image/x-icon">
</head>
<body>
  
  <main class="app-container" style="justify-content: center; height: 100vh; padding-bottom: 0;">
    
    <div class="card-mobile" style="padding: 40px 26px;">
        <div class="logo-area" style="margin-bottom: 30px;">
            <img src="assets/img/logo02.jpeg" alt="Logo Ruy Costa" class="logo-img" style="width: 85px; height: 85px;">
            <h1 style="font-family: var(--font-heading); font-size: 1.6rem; color: var(--gold-neon); text-align: center;">Painel de Gestão</h1>
            <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-top: 5px;">Acesso exclusivo para a equipe</p>
        </div>

        <form id="formLogin">
            <div class="input-group">
                <label for="email">E-mail Corporativo</label>
                <input type="email" id="email" placeholder="admin@ruycosta.com.br" required>
            </div>

            <div class="input-group" style="margin-top: 10px;">
                <label for="senha">Palavra-passe</label>
                <input type="password" id="senha" placeholder="••••••••" required>
            </div>

            <button type="button" class="btn-agendar" style="margin-top: 24px; width: 100%;" onclick="simularLogin()">Entrar no Sistema</button>
        </form>

        <a href="index.html" class="btn-voltar" style="margin-top: 20px; border: none; color: var(--text-muted);">← Voltar ao site principal</a>
    </div>

  </main>

  <script>
      function simularLogin() {
          const email = document.getElementById('email').value;
          const senha = document.getElementById('senha').value;

          // Validação simulada para fins de protótipo Front-end
          if (email === 'admin@ruycosta.com.br' && senha === 'admin123') {
              // Redireciona para o futuro dashboard
              window.location.href = 'dashboard.html';
          } else {
              alert('⚠️ Credenciais incorretas. Tente novamente.');
          }
      }
  </script>
</body>
</html>
